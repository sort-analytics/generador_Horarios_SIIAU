<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIIAU Schedule API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-blue-900">🎓 SIIAU Schedule API</h1>
            <p class="text-gray-600">Extracción estructurada de materias para generador de horarios</p>
        </header>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <form id="siiauForm" class="space-y-6">
                <!-- Selector de Filtros Generales -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Ciclo Lectivo</label>
                        <select id="ciclo" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none border-gray-300">
                            <option value="202620" selected>202620 - Calendario 26 B</option>
                            <option value="202710">202710 - Calendario 27 A</option>
                            <option value="202680">202680 - Ciclo de Verano 2026</option>
                            <option value="202610">202610 - Calendario 26 A</option>
                            <option value="202580">202580 - Ciclo de Verano 2025</option>
                            <option value="202520">202520 - Calendario 25 B</option>
                            <option value="202510">202510 - Calendario 25 A</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Centro Universitario (CUP)</label>
                        <select id="centro" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none border-gray-300">
                            <option value="D" selected>D - C.U. DE CS. EXACTAS E ING. (CUCEI)</option>
                            <option value="3">3 - C. U. DE TLAJOMULCO</option>
                            <option value="4">4 - C. U. DE GUADALAJARA</option>
                            <option value="5">5 - C.U. DE TLAQUEPAQUE</option>
                            <option value="6">6 - C.U. DE CHAPALA</option>
                            <option value="A">A - C.U. DE ARTE, ARQ. Y DISEÑO (CUAAD)</option>
                            <option value="B">B - C.U. DE CS. BIOLOGICO Y AGR. (CUCBA)</option>
                            <option value="C">C - C.U. DE CS. ECONOMICO-ADMVAS. (CUCEA)</option>
                            <option value="E">E - C.U. DE CS. DE LA SALUD (CUCS)</option>
                            <option value="F">F - C.U. DE CS. SOCIALES Y HUM. (CUCSH)</option>
                            <option value="G">G - C.U. DE LOS ALTOS</option>
                            <option value="H">H - C.U. DE LA CIENEGA</option>
                            <option value="I">I - C.U. DE LA COSTA</option>
                            <option value="J">J - C.U. DE LA COSTA SUR</option>
                            <option value="K">K - C.U. DEL SUR</option>
                            <option value="M">M - C. U. DE LOS VALLES</option>
                            <option value="N">N - C.U. DEL NORTE</option>
                            <option value="O">O - CUCEI SEDE VALLES</option>
                            <option value="P">P - CUCSUR SEDE VALLES</option>
                            <option value="Q">Q - CUCEI SEDE NORTE</option>
                            <option value="U">U - SISTEMA DE UNIVERSIDAD VIRTUAL (SUV)</option>
                        </select>
                    </div>
                </div>

                <!-- Input interactivo tipo Chips / Cajitas -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Materias a consultar</label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="materiaInput" placeholder="Escribe la clave (ej. IL355) y presiona Enter o Agregar" class="flex-1 border rounded-lg px-3 py-2 uppercase font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none border-gray-300">
                        <button type="button" id="addBtn" onclick="agregarMateriaDesdeInput()" class="bg-gray-800 hover:bg-gray-900 text-white font-medium px-4 py-2 rounded-lg text-sm transition">
                            + Agregar
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mb-3">Puedes pegar una lista de claves (separadas por espacio o coma) y se convertirán en cajitas automáticamente.</p>
                    
                    <!-- Contenedor dinámico donde se agregan los chips -->
                    <div id="chipsContainer" class="flex flex-wrap gap-2 p-3 bg-gray-50 border border-dashed rounded-lg min-h-[52px] items-center">
                        <span class="text-xs text-gray-400 italic" id="emptyNotice">No hay materias agregadas aún.</span>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow text-base">
                    Consultar Oferta de Materias
                </button>
            </form>
        </div>

        <div id="loading" class="hidden text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-700"></div>
            <p class="mt-2 text-gray-600 font-medium">Consultando materias en SIIAU...</p>
        </div>

        <div id="resultsContainer" class="space-y-6 hidden">
            <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow border">
                <div>
                    <h2 class="text-xl font-bold text-gray-800" id="resultsHeader">Resultados</h2>
                    <p class="text-xs text-gray-500" id="resultsSubheader"></p>
                </div>
                <button onclick="toggleJsonView()" class="text-sm bg-gray-200 hover:bg-gray-300 font-medium px-3 py-1.5 rounded-lg text-gray-700">
                    Ver JSON
                </button>
            </div>
            <pre id="jsonPreview" class="hidden bg-gray-900 text-green-400 p-4 rounded-lg overflow-x-auto text-xs font-mono max-h-96"></pre>
            <div id="tablesContainer" class="space-y-8"></div>
        </div>
    </div>

    <script>
        let materiasSet = new Set(['IL355', 'CC100']);
        let rawData = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderChips();

            // Detectar tecla Enter en el input de materias
            document.getElementById('materiaInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    agregarMateriaDesdeInput();
                }
            });

            // Permitir pegar multiples claves de golpe (auto-split)
            document.getElementById('materiaInput').addEventListener('paste', (e) => {
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text');
                const items = text.split(/[\n,;\s]+/).map(m => m.trim().toUpperCase()).filter(m => m.length > 0);
                items.forEach(m => materiasSet.add(m));
                document.getElementById('materiaInput').value = '';
                renderChips();
            });
        });

        function agregarMateriaDesdeInput() {
            const input = document.getElementById('materiaInput');
            const items = input.value.split(/[\n,;\s]+/).map(m => m.trim().toUpperCase()).filter(m => m.length > 0);
            items.forEach(m => materiasSet.add(m));
            input.value = '';
            renderChips();
        }

        function removerMateria(clave) {
            materiasSet.delete(clave);
            renderChips();
        }

        function renderChips() {
            const container = document.getElementById('chipsContainer');
            if (materiasSet.size === 0) {
                container.innerHTML = '<span class="text-xs text-gray-400 italic" id="emptyNotice">No hay materias agregadas aún.</span>';
                return;
            }

            container.innerHTML = Array.from(materiasSet).map(m => `
                <span class="inline-flex items-center bg-blue-100 text-blue-800 text-sm font-semibold font-mono px-3 py-1 rounded-full border border-blue-200">
                    ${m}
                    <button type="button" onclick="removerMateria('${m}')" class="ml-2 text-blue-600 hover:text-red-600 font-bold focus:outline-none text-xs">
                        ✕
                    </button>
                </span>
            `).join('');
        }

        document.getElementById('siiauForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const materiasList = Array.from(materiasSet);

            if (materiasList.length === 0) {
                alert("Agrega al menos una clave de materia a la lista.");
                return;
            }

            const ciclo = document.getElementById('ciclo').value.trim();
            const centro = document.getElementById('centro').value;
            
            const loading = document.getElementById('loading');
            const resultsContainer = document.getElementById('resultsContainer');
            const tablesContainer = document.getElementById('tablesContainer');
            
            loading.classList.remove('hidden');
            resultsContainer.classList.add('hidden');
            tablesContainer.innerHTML = '';

            try {
                const response = await fetch(`/api/oferta/batch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ materias: materiasList, ciclo, centro })
                });

                rawData = await response.json();

                if (!response.ok || rawData.detail) {
                    throw new Error(rawData.detail || `Error HTTP ${response.status}`);
                }

                renderBatchMaterias(rawData);

                document.getElementById('jsonPreview').textContent = JSON.stringify(rawData, null, 2);
                resultsContainer.classList.remove('hidden');
            } catch (err) {
                alert('⚠️ Error en la consulta: ' + err.message);
            } finally {
                loading.classList.add('hidden');
            }
        });

        function renderBatchMaterias(data) {
            document.getElementById('resultsHeader').textContent = `Consulta de ${data.total_materias} Materia(s)`;
            document.getElementById('resultsSubheader').textContent = `Total de secciones disponibles encontradas: ${data.total_secciones_global || 0}`;
            
            const container = document.getElementById('tablesContainer');
            for (const [materia, secciones] of Object.entries(data.resultados || {})) {
                container.appendChild(createTableCard(materia, secciones));
            }
        }

        function createTableCard(materia, secciones) {
            const wrapper = document.createElement('div');
            wrapper.className = "bg-white shadow rounded-lg overflow-hidden border border-gray-200";

            let rowsHtml = '';
            if (!secciones || secciones.length === 0) {
                rowsHtml = `<tr><td colspan="6" class="px-6 py-4 text-center text-sm text-gray-500">No se encontraron secciones para esta clave en el centro seleccionado.</td></tr>`;
            } else {
                secciones.forEach(sec => {
                    const horariosHtml = sec.horarios.map(h => 
                        `<div class="mb-1 text-xs">
                            <span class="font-semibold text-blue-800">${h.dias.join(', ')}</span> 
                            <span class="bg-gray-100 px-1 rounded border">${h.hora_inicio}-${h.hora_fin}</span>
                            <span class="text-gray-500">[${h.edificio} ${h.aula}]</span>
                        </div>`
                    ).join('');

                    const profsHtml = sec.profesores.map(p => 
                        `<div class="text-xs text-gray-700 font-medium">👨‍🏫 ${p}</div>`
                    ).join('') || '<span class="text-xs text-red-400">Sin Profesor</span>';

                    rowsHtml += `
                        <tr class="hover:bg-gray-50 text-sm border-b">
                            <td class="px-4 py-3 font-mono font-bold text-blue-900">${sec.nrc}</td>
                            <td class="px-4 py-3 font-semibold">${sec.seccion}</td>
                            <td class="px-4 py-3">${sec.creditos} CR</td>
                            <td class="px-4 py-3">
                                <span class="px-2 py-1 rounded text-xs ${sec.disponibles > 0 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'} font-medium">
                                    ${sec.disponibles} / ${sec.cupo}
                                </span>
                            </td>
                            <td class="px-4 py-3">${horariosHtml}</td>
                            <td class="px-4 py-3">${profsHtml}</td>
                        </tr>
                    `;
                });
            }

            wrapper.innerHTML = `
                <div class="bg-blue-900 text-white px-6 py-3 flex justify-between items-center">
                    <h3 class="font-bold text-lg">${materia}</h3>
                    <span class="text-xs bg-blue-800 px-2.5 py-1 rounded-full font-medium">${secciones ? secciones.length : 0} secciones</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                            <tr>
                                <th class="px-4 py-3">NRC</th>
                                <th class="px-4 py-3">Sec</th>
                                <th class="px-4 py-3">Créditos</th>
                                <th class="px-4 py-3">Lugares</th>
                                <th class="px-4 py-3">Horario y Aula</th>
                                <th class="px-4 py-3">Profesor</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
            `;
            return wrapper;
        }

        function toggleJsonView() {
            document.getElementById('jsonPreview').classList.toggle('hidden');
        }
    </script>
</body>
</html>
